oice",cat:"basic"},{id:17,text:"أي من الحقوق التالية يحمي المصالح الاقتصادية للمشاهير؟",answer:"حقوق الدعاية.",type:"choice",cat:"basic"},{id:18,text:"التراخيص التي تحصل عليها الشركات للالتزام بحماية البيانات الشخصية؟",answer:"تراخيص مركز حماية البيانات الشخصية.",type:"choice",cat:"basic"},{id:19,text:"علل اشتراط مبدأ التسجيل لتثبيت حقوق النشر عكس حقوق الملكية الصناعية؟",answer:"حقوق المؤلف تثبت بمجرد الإنشاء (مبدأ عدم التسجيل)، بينما حقوق الملكية الصناعية تتطلب التسجيل.",type:"essay",cat:"ip"},{id:20,text:"قارن بين حقوق النشر والحقوق المجاورة؟",answer:"حقوق النشر للمبدع والمؤلف، الحقوق المجاورة للمؤديين ومنتج التسجيلات وهيئات الإذاعة.",type:"essay",cat:"ip"},{id:21,text:"اشرح كيفية تكامل العناصر الأساسية لأمن المعلومات (السرية، السلامة، التوافر)؟",answer:"السرية (الوصول للمصرح لهم)، السلامة (عدم التدمير أو العبث)، التوافر (الوصول للمعلومات في أي وقت).",type:"essay",cat:"ip"},{id:22,text:"وضح طبيعة وآلية انتشار برمجيات الدودة؟",answer:"برامج ضارة تنسخ نفسها عبر الشبكات والإنترنت.",type:"essay",cat:"ip"},{id:23,text:"ناقش المخاطر الناجمة عن استخدام برنامج حاسوبي جديد؟",answer:"مخاطر نسخ وتوزيع غير قانوني، والحل هو تصنيفه وإثباته قانونياً.",type:"essay",cat:"ip"},{id:24,text:"نقسم حقوق الملكية الفكرية إلى حقوق ملكية صناعية وحقوق نشر؟",answer:"صح.",type:"tf",cat:"ip"},{id:25,text:"فترة حماية براءات الاختراع؟",answer:"20 سنة.",type:"choice",cat:"ip"},{id:26,text:"وضح الفرق بين براءة الاختراع والعلامة التجارية؟",answer:"براءة الاختراع للابتكارات التقنية (20 سنة)، العلامة التجارية لتمييز المنتجات والخدمات (10 سنوات).",type:"essay",cat:"ip"},{id:27,text:"ما أهمية ترخيص المشاع الإبداعي (CC-BY)؟",answer:"السماح باستخدام العمل بشرط ذكر اسم المؤلف.",type:"essay",cat:"ip"},{id:28,text:"اشرح صور الجرائم الإلكترونية التي تعتمد على انتحال هوية؟",answer:"الوصول غير القانوني للأجهزة باستخدام بيانات أو هويات مزورة.",type:"essay",cat:"ip"},{id:29,text:"المخاطر الناجمة عن برامج الفدية؟",answer:"تشفير البيانات وجعلها غير قابلة للوصول إلا بدفع فدية.",type:"essay",cat:"ip"},{id:30,text:"خطوات إعادة نشر ملف موسيقي؟",answer:"التحقق من حقوق النشر، الحصول على إذن، تحديد المصدر بوضوح.",type:"essay",cat:"ip"},{id:31,text:"حقوق النشر تثبت لحظة إنشاء العمل؟",answer:"صح.",type:"tf",cat:"ip"},{id:32,text:"قارن بين حقوق التصميم وحقوق نموذج المنفعة؟",answer:"حقوق التصميم تحمي المظهر الخارجي، نموذج المنفعة يحمي الحلول التقنية والتحسينات العملية.",type:"essay",cat:"ip"},{id:33,text:"علل امتداد فترة حماية حقوق النشر لحياة المبدع و50 سنة بعد وفاته؟",answer:"لضمان حقوق المبدع الاقتصادية وتشجيع استمرارية الإبداع.",type:"essay",cat:"ip"},{id:34,text:"اشرح أساليب جمع المعلومات دون علم المستخدم مثل برامج التجسس؟",answer:"برامج تسرق البيانات الشخصية وترسلها لأطراف أخرى.",type:"essay",cat:"ip"},{id:35,text:"ما الغرض من حقوق النشر؟",answer:"المساهمة في التطوير الثقافي وضمان الاستخدام العادل وحماية المبدع.",type:"essay",cat:"ip"},{id:36,text:"الملكية الصناعية تشمل براءات الاختراع والعلامات التجارية؟",answer:"صح.",type:"tf",cat:"ip"},{id:37,text:"يمثل البايت وحدة التخزين الأساسية للحرف الواحد؟",answer:"صح (يتكون من 8 بت).",type:"tf",cat:"data"},{id:38,text:"النظام الثنائي يعتمد على الرقمين 0 و1؟",answer:"صح.",type:"tf",cat:"data"},{id:39,text:"أي من التقنيات يطبق مبدأ شيء لا أعرفه؟",answer:"المصدقة الثنائية (2FA).",type:"choice",cat:"data"},{id:40,text:"أي من الوحدات تعادل 1024 ميجا بايت؟",answer:"الجيجا بايت.",type:"choice",cat:"data"},{id:41,text:"الفرق بين الأسكي (ASCII) واليونيكود (Unicode)؟",answer:"الأسكي يدعم الحروف الإنجليزية والرموز فقط، اليونيكود يدعم جميع لغات العالم.",type:"essay",cat:"data"},{id:42,text:"زيادة عدد البتات المستخدمة في تمثيل البيانات تقلل الاحتمالات؟",answer:"خطأ (تزيدها).",type:"tf",cat:"data"},{id:43,text:"الجهاز الذي يعمل كحاجز أمني لمراقبة الشبكة؟",answer:"جدار الحماية (Firewall).",type:"choice",cat:"data"},{id:44,text:"تعريف النظام السادس عشر (Hexadecimal)؟",answer:"نظام تمثيل أرقام يبدأ من 0-9 ثم الحروف A-F (حيث A=10 و F=15).",type:"essay",cat:"data"},{id:45,text:"ما المقصود برمز الحرف (Character Code)؟",answer:"قيمة رقمية فريدة يتم تعيينها
